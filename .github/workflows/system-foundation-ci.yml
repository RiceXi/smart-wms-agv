name: system-foundation-ci

on:
  pull_request:
    paths:
      - "merged-release/**"
      - ".github/workflows/system-foundation-ci.yml"
  push:
    branches:
      - "codex/system-foundation"
      - "feat/integrate"
    paths:
      - "merged-release/**"
      - ".github/workflows/system-foundation-ci.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: merged-release

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Python unit and acceptance tests
        run: python -m unittest discover -s tests -v

      - name: Stability smoke
        run: >-
          python tests/stress_runner.py
          --agvs 10
          --orders 2
          --scenarios 5
          --ticks 200
          --output test-results/system-foundation-smoke.json

      - name: JavaScript syntax
        run: node --check static/app.js

      - name: Validate JSON contracts
        run: |
          python -m json.tool static/openapi.json > /dev/null
          python -m json.tool test-results/system-foundation-smoke.json > /dev/null

      - name: Validate Compose model
        run: docker compose config > /dev/null

      - name: Build application image
        run: docker build -t smartwms-ci:${{ github.sha }} .

      - name: Validate Prometheus configuration
        run: >-
          docker run --rm
          -v "$PWD/deploy/prometheus:/etc/prometheus:ro"
          --entrypoint /bin/promtool
          prom/prometheus:v2.55.1
          check config /etc/prometheus/prometheus.yml
