name: Feature
description: 提交一个可验收的功能任务
title: "[FEAT] "
labels: ["feature"]
body:
  - type: textarea
    id: goal
    attributes:
      label: 目标
      description: 用户或系统能完成什么。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收条件
      description: 写出可重复执行的步骤和结果。
    validations:
      required: true
  - type: dropdown
    id: owner
    attributes:
      label: 主责成员
      options:
        - member-1
        - member-2
        - member-3
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: 依赖与契约
      description: 列出依赖的服务、事件、API 或数据。
