<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>智能仓储 WMS + AGV 调度控制台</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo">WMS·AGV</span>
    <span class="sub" id="top-map-version">地图版本 --</span>
  </div>

  <div class="top-stats">
    <span class="chip">Tick <b id="top-tick">0</b></span>
    <span class="chip">运行 <b id="top-running">未知</b></span>
    <span class="chip">速度 <b id="top-speed">1x</b></span>
    <span class="chip">Seed <b id="top-seed">--</b></span>
    <span class="chip">场景 <b id="top-scenario">--</b></span>
    <span class="chip" id="top-conn">SSE 未连接</span>
  </div>

  <div class="controls">
    <button id="btn-start" class="btn primary" type="button">启动/继续</button>
    <button id="btn-pause" class="btn" type="button">暂停</button>
    <button id="btn-step" class="btn" type="button">单步 +1</button>
    <div class="seg" id="speed-seg">
      <button class="btn seg-btn active" data-speed="1" type="button">1x</button>
      <button class="btn seg-btn" data-speed="4" type="button">4x</button>
      <button class="btn seg-btn" data-speed="8" type="button">8x</button>
    </div>
    <button id="btn-reset" class="btn warn" type="button">重置</button>
  </div>

  <div class="inject">
    <select id="inject-type" class="sel" aria-label="事件类型">
      <option value="fault">事件注入：AGV 故障</option>
      <option value="offline">事件注入：AGV 离线</option>
      <option value="roadblock">事件注入：临时封路</option>
      <option value="rush_order">事件注入：急单</option>
      <option value="recover">事件注入：故障恢复</option>
    </select>
    <div class="inject-fields" id="inject-fields"></div>
    <button id="btn-inject" class="btn primary" type="button">注入</button>
  </div>

  <div class="popover" id="reset-pop" hidden>
    <div class="pop-title">重置仿真</div>
    <label class="pop-row">场景
      <select id="reset-scenario" class="sel"></select>
    </label>
    <label class="pop-row">Seed
      <input id="reset-seed" class="inp" type="number" step="1" />
    </label>
    <div class="pop-row btns">
      <button id="btn-reset-confirm" class="btn danger" type="button">确认重置</button>
      <button id="btn-reset-cancel" class="btn" type="button">取消</button>
    </div>
  </div>
</header>

<main class="app-main">
  <section class="panel map-panel">
    <div class="panel-head">
      <h2>仓库实时地图</h2>
      <span class="chip">帧率 <b id="fps">--</b> fps</span>
      <span class="chip">地图 <b id="map-size">--</b></span>
      <span class="chip">封路 <b id="roadblock-count">0</b></span>
      <div class="legend" id="legend">
        <span class="lg"><i class="sw sw-floor"></i>地面</span>
        <span class="lg"><i class="sw sw-shelf"></i>货架</span>
        <span class="lg"><i class="sw sw-pick"></i>拣选点</span>
        <span class="lg"><i class="sw sw-drop"></i>放货点</span>
        <span class="lg"><i class="sw sw-charger"></i>充电位</span>
        <span class="lg"><i class="sw sw-blocked"></i>封路</span>
      </div>
    </div>

    <div class="canvas-wrap" id="canvas-wrap">
      <canvas id="map-canvas"></canvas>
      <div class="tooltip" id="cell-tooltip" hidden></div>
      <div class="map-empty" id="map-empty">正在加载地图数据…</div>
    </div>

    <div class="map-foot">
      <div class="card" id="agv-detail">
        <div class="card-title">AGV 详情</div>
        <div class="card-body muted">在地图上点击 AGV 查看详情。</div>
      </div>
      <div class="card" id="roadblock-card">
        <div class="card-title">当前封路</div>
        <div class="card-body" id="roadblock-list"><span class="muted">无</span></div>
      </div>
    </div>
  </section>

  <aside class="panel side-panel">
    <nav class="tabs" id="tabs">
      <button class="tab-btn active" data-tab="orders" type="button">订单</button>
      <button class="tab-btn" data-tab="tasks" type="button">任务</button>
      <button class="tab-btn" data-tab="agvs" type="button">AGV</button>
      <button class="tab-btn" data-tab="analysis" type="button">分析</button>
      <button class="tab-btn" data-tab="events" type="button">事件</button>
    </nav>

    <div class="panes">
      <!-- 订单 -->
      <section class="tab-pane active" data-tab="orders">
        <div class="card">
          <div class="card-title">创建出库订单</div>
          <div class="card-body">
            <div class="form-grid">
              <label>单号<input id="ord-code" class="inp" type="text" placeholder="OUT-20261118-001" /></label>
              <label>优先级<input id="ord-priority" class="inp" type="number" min="1" max="10" value="5" /></label>
              <label>制单人<input id="ord-requester" class="inp" type="text" value="demo" /></label>
              <label>放货库位<input id="ord-drop" class="inp" type="text" list="dl-location" placeholder="DROP-01" /></label>
            </div>
            <div class="lines-head">
              <span>明细</span>
              <button id="ord-add-line" class="btn tiny" type="button">+ 添加明细</button>
            </div>
            <div id="ord-lines"></div>
            <div class="form-actions">
              <button id="ord-create" class="btn primary" type="button">创建订单</button>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-title">订单列表</div>
          <div class="card-body">
            <div class="filter-row">
              <select id="order-status" class="sel">
                <option value="">全部状态</option>
                <option value="draft">draft 草稿</option>
                <option value="allocated">allocated 已预占</option>
                <option value="released">released 已生成任务</option>
                <option value="completed">completed 已完成</option>
                <option value="cancelled">cancelled 已取消</option>
                <option value="failed">failed 执行失败</option>
              </select>
              <button id="order-refresh" class="btn" type="button">刷新</button>
            </div>
            <div class="table-wrap"><table class="tbl" id="orders-table"></table></div>
          </div>
        </div>
      </section>

      <!-- 任务 -->
      <section class="tab-pane" data-tab="tasks">
        <div class="card">
          <div class="card-title">任务筛选</div>
          <div class="card-body">
            <div class="filter-row">
              <select id="task-status" class="sel">
                <option value="">全部状态</option>
                <option value="pending">pending 待指派</option>
                <option value="assigned">assigned 已指派</option>
                <option value="running">running 执行中</option>
                <option value="completed">completed 已完成</option>
                <option value="cancelled">cancelled 已取消</option>
                <option value="failed">failed 已失败</option>
              </select>
              <input id="task-agv" class="inp" type="text" list="dl-agv" placeholder="AGV 编号" />
            </div>
            <div class="filter-row">
              <input id="task-pmin" class="inp" type="number" min="1" max="10" placeholder="优先级 ≥" />
              <input id="task-pmax" class="inp" type="number" min="1" max="10" placeholder="优先级 ≤" />
              <button id="task-query" class="btn" type="button">查询</button>
              <button id="task-reset" class="btn" type="button">清空</button>
            </div>
            <div class="table-wrap"><table class="tbl" id="tasks-table"></table></div>
          </div>
        </div>
        <div class="card" id="timeline-card" hidden>
          <div class="card-title">任务时间线</div>
          <div class="card-body" id="timeline-body"></div>
        </div>
      </section>

      <!-- AGV -->
      <section class="tab-pane" data-tab="agvs">
        <div class="card">
          <div class="card-title">AGV 列表</div>
          <div class="card-body">
            <div class="filter-row">
              <select id="agv-status" class="sel">
                <option value="">全部状态</option>
                <option value="idle">idle 空闲</option>
                <option value="to_pickup">to_pickup 前往取货</option>
                <option value="loading">loading 取货确认</option>
                <option value="to_dropoff">to_dropoff 前往放货</option>
                <option value="unloading">unloading 放货确认</option>
                <option value="charging">charging 充电</option>
                <option value="fault">fault 故障</option>
                <option value="offline">offline 离线</option>
              </select>
              <button id="agv-refresh" class="btn" type="button">刷新</button>
            </div>
            <div class="agv-list" id="agv-list"></div>
          </div>
        </div>
      </section>

      <!-- 分析 -->
      <section class="tab-pane" data-tab="analysis">
        <div class="card">
          <div class="card-title">汇总指标</div>
          <div class="card-body">
            <div class="stat-grid" id="stat-grid"></div>
          </div>
        </div>
        <div class="card">
          <div class="card-title">AGV 利用率</div>
          <div class="card-body">
            <canvas id="chart-util" class="chart"></canvas>
            <div class="chart-note" id="chart-util-note"></div>
          </div>
        </div>
        <div class="card">
          <div class="card-title">每 tick 完成任务数</div>
          <div class="card-body">
            <canvas id="chart-throughput" class="chart"></canvas>
            <div class="chart-note" id="chart-throughput-note"></div>
          </div>
        </div>
        <div class="card">
          <div class="card-title">瓶颈巷道 TopN</div>
          <div class="card-body">
            <div class="table-wrap"><table class="tbl" id="bottleneck-table"></table></div>
          </div>
        </div>
      </section>

      <!-- 事件 -->
      <section class="tab-pane" data-tab="events">
        <div class="card">
          <div class="card-title">告警</div>
          <div class="card-body" id="alert-list"></div>
        </div>
        <div class="card">
          <div class="card-title">实时事件日志</div>
          <div class="card-body">
            <div class="filter-row">
              <input id="event-filter" class="inp" type="text" placeholder="按类型过滤，如 task." />
              <button id="event-refresh" class="btn" type="button">拉取历史</button>
              <label class="chk"><input id="event-follow" type="checkbox" checked /> 跟随最新</label>
            </div>
            <div class="table-wrap tall"><table class="tbl" id="events-table"></table></div>
          </div>
        </div>
      </section>
    </div>
  </aside>
</main>

<datalist id="dl-agv"></datalist>
<datalist id="dl-sku"></datalist>
<datalist id="dl-location"></datalist>

<div class="toast-host" id="toast-host"></div>

<script src="app.js" defer></script>
</body>
</html>
